# Render Blueprint — Assetorbit (Express API + built React frontend, one process)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: assetorbit
    runtime: node
    plan: free
    healthCheckPath: /api/health
    # Build the server (typecheck + compile) and the client (Vite), in that order.
    # The server serves client/dist as static files at runtime.
    # Note: --include=dev is required because Render sets NODE_ENV=production,
    # which makes npm skip devDependencies (@types, typescript) by default.
    buildCommand: cd server && npm ci --include=dev && npm run build && cd ../client && npm ci --include=dev && npm run build
    # Create/update the SQLite tables on every boot (idempotent), then start.
    # Required because free instances have ephemeral disks: the DB file (and
    # its tables) are recreated from the schema after each restart.
    startCommand: cd server && npx prisma db push && cd .. && node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Generate a strong random JWT signing secret once at service creation.
      - key: JWT_SECRET
        generateValue: true
